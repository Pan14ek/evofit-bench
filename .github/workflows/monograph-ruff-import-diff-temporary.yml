name: Temporary monograph Ruff import diff
on:
  push:
    branches:
      - test/binary-semantics-equivalence-monograph
jobs:
  import-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruff
        run: python -m pip install ruff==0.16.10
      - name: Show suggested import diff
        run: ruff check --select I --fix --diff tests/unit/test_monograph_boolean_semantics_regression.py || true
