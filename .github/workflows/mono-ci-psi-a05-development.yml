name: MONO CI Ψ A0.4 to A0.5 DEVELOPMENT archive

on:
  push:
    branches:
      - codex/pr56-a05-data-ownership
    paths:
      - .github/workflows/mono-ci-psi-a05-development.yml
      - Makefile
      - pyproject.toml
      - uv.lock
      - architecture/states/A0_5_MODULE_DATA_OWNERSHIP.*
      - architecture/acceptance/a1/**
      - experiments/execution/tooling/mono_ci_psi_a05.py
      - experiments/execution/tooling/mono_ci_psi_transition.py
      - experiments/execution/tooling/mono_ci_psi_evidence.py
      - experiments/execution/tooling/mono_ci_psi_coverage.py
      - experiments/execution/tooling/mono_ci_b0_psi_archive.py
      - experiments/execution/schemas/mono_ci_psi_*.schema.json
      - experiments/execution/schemas/mono_ci_b0_psi_reconstructed_baseline_a04_v1.schema.json
      - experiments/execution/mono-ci-b0-psi-execution-a05-v1/**
      - scripts/check_architecture_stages.py
      - tests/unit/test_a05_data_ownership.py
      - tests/unit/test_mono_ci_psi_a05.py
      - tests/unit/test_mono_ci_psi_coverage.py
      - tests/unit/test_architecture_stage_checks.py
      - tests/architecture/a1/**
      - docs/ARCHITECTURE.md
      - docs/TESTING.md
      - experiments/execution/CONTEXT.md
      - experiments/execution/tooling/CONTEXT.md
      - tests/unit/CONTEXT.md
      - .github/workflows/CONTEXT.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  development-archive:
    name: Development quality and raw ΔA5 evidence archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: evofit_test
          POSTGRES_USER: evofit
          POSTGRES_PASSWORD: evofit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evofit -d evofit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCHITECTURE_STAGE: A0_5_MODULE_DATA_OWNERSHIP
      DATABASE_URL: postgresql+psycopg://evofit:evofit@localhost:5432/evofit_test
      TEST_DATABASE_URL: postgresql+psycopg://evofit:evofit@localhost:5432/evofit_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev
      - name: Refresh package metadata
        run: sudo apt-get update
      - name: Install network namespace runner
        run: sudo apt-get install -y bubblewrap
      - name: Run B0 execution and archive regressions
        run: make test-mono-ci-b0-psi-execution
      - name: Run historical transition regressions
        run: make test-mono-ci-psi-transition
      - name: Run focused A0.5 ownership and method regressions
        run: make test-mono-ci-psi-a05
      - name: Run development quality gates
        run: make development-quality
      - name: Define unique run and artifact paths
        shell: bash
        run: |
          echo "EXECUTION_ID=DEV_PSI_TRANSITION_A05_GHA_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=mono-ci-psi-a05-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "RUN_OUTPUT=${RUNNER_TEMP}/mono-ci-psi-a05-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=${RUNNER_TEMP}/mono-ci-psi-a05-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" >> "$GITHUB_ENV"
          echo "VERIFY_OUTPUT=${RUNNER_TEMP}/mono-ci-psi-a05-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-verified" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=mono-ci-psi-a05-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "RELEASE_READBACK=${RUNNER_TEMP}/mono-ci-psi-a05-release-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "RELEASE_VERIFY=${RUNNER_TEMP}/mono-ci-psi-a05-release-verified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "WORKFLOW_RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Execute Ψ on canonical A0.4 to committed A0.5
        run: >-
          uv run --frozen --extra dev python -m experiments.execution.tooling.mono_ci_psi_a05
          --repository "$GITHUB_WORKSPACE"
          --output "$RUN_OUTPUT"
          --execution-id "$EXECUTION_ID"
      - name: Pack and verify the ΔA5 archive
        run: >-
          uv run --frozen --extra dev python -m experiments.execution.tooling.mono_ci_b0_psi_archive transition-pack
          --run "$RUN_OUTPUT"
          --archive "$ARCHIVE_PATH"
          --repository "$GITHUB_WORKSPACE"
          --workflow-run-url "$WORKFLOW_RUN_URL"
          --artifact-name "$ARTIFACT_NAME"
          --uv-version "$(uv --version)"
      - name: Verify archive and extracted readback
        run: >-
          uv run --frozen --extra dev python -m experiments.execution.tooling.mono_ci_b0_psi_archive transition-verify
          --archive "$ARCHIVE_PATH"
          --repository "$GITHUB_WORKSPACE"
          --extract-to "$VERIFY_OUTPUT"
      - name: Upload persistent DEVELOPMENT evidence
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.ARCHIVE_PATH }}.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Record artifact receipt
        if: steps.upload.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          echo "### ΔA5 Ψ DEVELOPMENT archive" >> "$GITHUB_STEP_SUMMARY"
          echo "- Execution ID: \`$EXECUTION_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`$ARTIFACT_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact URL: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive SHA-256: \`$(sha256sum "$ARCHIVE_PATH" | cut -d ' ' -f 1)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub artifact digest: \`$ARTIFACT_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: 90 days" >> "$GITHUB_STEP_SUMMARY"
          echo "- Study readiness NO_GO; measurement NOT_EXECUTED; P_ALGORITHM_STATUS NOT_READY; G1 INCOMPLETE; G4 NOT_AUTHORIZED; reference gate NOT_READY; scoring NOT_EXECUTED." >> "$GITHUB_STEP_SUMMARY"
      - name: Persist archive as a private prerelease if Actions storage is unavailable
        if: steps.upload.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="${RUNNER_TEMP}/${ARTIFACT_NAME}-release-notes.md"
          cat > "$notes_file" <<EOF
          Verified raw Method Ψ DEVELOPMENT archive for ΔA5.

          - Execution ID: ${EXECUTION_ID}
          - Source revision: ${GITHUB_SHA}
          - Workflow run: ${WORKFLOW_RUN_URL}
          - Archive SHA-256: $(sha256sum "$ARCHIVE_PATH" | cut -d ' ' -f 1)
          - Study readiness: NO_GO
          - Measurement: NOT_EXECUTED
          - P_ALGORITHM_STATUS: NOT_READY
          - G1: INCOMPLETE
          - G4: NOT_AUTHORIZED
          - Reference gate: NOT_READY
          EOF
          gh release create "$RELEASE_TAG" "$ARCHIVE_PATH" "$ARCHIVE_PATH.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$ARTIFACT_NAME" \
            --notes-file "$notes_file" \
            --prerelease
          mkdir -p "$RELEASE_READBACK"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RELEASE_READBACK"
          archive_name="$(basename "$ARCHIVE_PATH")"
          (cd "$RELEASE_READBACK" && sha256sum --check "${archive_name}.sha256")
          uv run --frozen --extra dev python -m experiments.execution.tooling.mono_ci_b0_psi_archive transition-verify \
            --archive "${RELEASE_READBACK}/${archive_name}" \
            --repository "$GITHUB_WORKSPACE" \
            --extract-to "$RELEASE_VERIFY"
          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "### ΔA5 DEVELOPMENT evidence archive fallback" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact storage was unavailable; verified assets are stored on a private prerelease." >> "$GITHUB_STEP_SUMMARY"
          echo "- Execution ID: \`$EXECUTION_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: $release_url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive SHA-256: \`$(sha256sum "$ARCHIVE_PATH" | cut -d ' ' -f 1)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source revision: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Research readiness and authorization gates remain NO_GO/NOT_READY/INCOMPLETE/NOT_AUTHORIZED." >> "$GITHUB_STEP_SUMMARY"
