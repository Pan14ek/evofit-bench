name: MONO CI B0/Ψ DEVELOPMENT archive

on:
  push:
    branches:
      - codex/mono-ci-b0-psi-execution
    paths:
      - .github/workflows/mono-ci-b0-psi-development.yml
      - Makefile
      - pyproject.toml
      - uv.lock
      - architecture/acceptance/a1/**
      - experiments/execution/tooling/mono_ci_b0_psi_*.py
      - experiments/execution/schemas/mono_ci_b0_psi_*.schema.json
      - experiments/execution/mono-ci-b0-psi-execution-v1/RECONSTRUCTED_B0_A03_V1.json
      - experiments/execution/mono-ci-b0-psi-execution-v1/RECONSTRUCTED_B0_A03_V1.json.sha256
      - tests/unit/test_mono_ci_b0_psi_*.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-archive:
    name: Development quality and raw evidence archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: evofit_test
          POSTGRES_USER: evofit
          POSTGRES_PASSWORD: evofit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evofit -d evofit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCHITECTURE_STAGE: A0_4_REPORT_QUERY_PORT
      DATABASE_URL: postgresql+psycopg://evofit:evofit@localhost:5432/evofit_test
      TEST_DATABASE_URL: postgresql+psycopg://evofit:evofit@localhost:5432/evofit_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev
      - name: Run focused B0/Ψ execution tests
        run: make test-mono-ci-b0-psi-execution
      - name: Run development quality gates
        run: make development-quality
      - name: Define unique run and artifact paths
        shell: bash
        run: |
          echo "EXECUTION_ID=DEV_MONO_CI_GHA_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=mono-ci-b0-psi-development-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "RUN_OUTPUT=${RUNNER_TEMP}/mono-ci-b0-psi-development-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=${RUNNER_TEMP}/mono-ci-b0-psi-development-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" >> "$GITHUB_ENV"
          echo "VERIFY_OUTPUT=${RUNNER_TEMP}/mono-ci-b0-psi-development-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-verified" >> "$GITHUB_ENV"
          echo "WORKFLOW_RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Execute fresh DEVELOPMENT-only B0 evaluator probe
        run: >-
          uv run --frozen --extra dev python -m experiments.execution.tooling.mono_ci_b0_psi_execution
          --development-validation
          --repository "$GITHUB_WORKSPACE"
          --output "$RUN_OUTPUT"
          --execution-id "$EXECUTION_ID"
      - name: Pack and verify deterministic evidence archive
        run: >-
          uv run --frozen --extra dev python -m experiments.execution.tooling.mono_ci_b0_psi_archive pack
          --run "$RUN_OUTPUT"
          --archive "$ARCHIVE_PATH"
          --repository "$GITHUB_WORKSPACE"
          --workflow-run-url "$WORKFLOW_RUN_URL"
          --artifact-name "$ARTIFACT_NAME"
          --uv-version "$(uv --version)"
      - name: Verify extracted archive readback
        run: >-
          uv run --frozen --extra dev python -m experiments.execution.tooling.mono_ci_b0_psi_archive verify
          --archive "$ARCHIVE_PATH"
          --extract-to "$VERIFY_OUTPUT"
      - name: Upload persistent DEVELOPMENT evidence
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.ARCHIVE_PATH }}.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Record artifact receipt
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          echo "### DEVELOPMENT evidence archive" >> "$GITHUB_STEP_SUMMARY"
          echo "- Execution ID: \`$EXECUTION_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`$ARTIFACT_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact URL: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive SHA-256: \`$(sha256sum "$ARCHIVE_PATH" | cut -d ' ' -f 1)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub artifact digest: \`$ARTIFACT_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: 90 days" >> "$GITHUB_STEP_SUMMARY"
          echo "- Boundary: DEVELOPMENT only; study readiness NO_GO; measurement NOT_EXECUTED; Ψ BLOCKED_NOT_EXECUTED." >> "$GITHUB_STEP_SUMMARY"
