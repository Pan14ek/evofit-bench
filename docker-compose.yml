services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: evofit
      POSTGRES_USER: evofit
      POSTGRES_PASSWORD: evofit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evofit -d evofit"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    image: evofit-bench-app
    environment:
      APP_ENV: local
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+psycopg://evofit:evofit@postgres:5432/evofit
      LOG_LEVEL: INFO
      EXPERIMENT_MODE: ${EXPERIMENT_MODE:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SEED_ID: ${SEED_ID:-a0-v1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
